<body>
    {% extends "base.html" %}

    {% block content %}
        <h2>Hello {{name}}</h2>
        {% if info %}
        <p>You are {{info.age}} years old and you are
            {% if info.gender.upper() == M %}
                a male
            {% elif info.gender.upper() == F%}    
                a female
            {% else %}
                non binary
            {% endif %}    
        </p>
        {% else %}
        <p>You have no info</p>
        {% endif %}
    {% endblock %}
</body>
</html>
