<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About page</title>
</head>
<body>
    {% extends "base.html" %}
    {% block content %}
        {%if logged_in%}
        <h1>Welcome back friend!</h1>
        {% else %}
        <h1>Welcome stranger!</h1>
        {% endif %}

        <ol>
        {% for item in items %}
            <li>{{item}}</li>
        {% endfor %}
        </ol>

        <ol>
        {% for key,value in students.items() %}
            <li>{{key}} has {{value}}</li>
        {% endfor %}
        </ol>
    {% endblock %}    
</body>
</html>
