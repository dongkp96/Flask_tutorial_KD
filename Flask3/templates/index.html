<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask 3 home page</title>
</head>
<body>
    {% extends "base.html" %}

    {% block content %}
        <h2>Hello {{name}}</h2>
        <p>You are {{info.age}} years old and you are
            {% if info.gender.upper() == M %}
                a male
            {% elif info.gender.upper() == F%}    
                a female
            {% else %}
                non binary
            {% endif %}    
        </p>
    {% endblock %}
</body>
</html>
